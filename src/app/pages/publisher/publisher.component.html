<mat-form-field> 
  <input matInput (keyup)="applyFilter($event)"
  placeholder="Ex. Prentice" > 

  </mat-form-field> 
  
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" matSort>
  
    <!-- Position Column -->
    <ng-container matColumnDef="idPublisher">
      <th mat-header-cell *matHeaderCellDef> ID </th>
      <td mat-cell *matCellDef="let element"> {{element.idPublisher}} </td>
    </ng-container>
  
    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
      <td mat-cell *matCellDef="let element"> {{element.name}} </td>
    </ng-container>
  
    <!-- Weight Column -->
    <ng-container matColumnDef="address">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> address </th>
      <td mat-cell *matCellDef="let element"> {{element.address}} </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> actions </th>
      <td mat-cell *matCellDef="let item">
      <button mat-button>
        <mat-icon> mode_edit</mat-icon> Edit
      </button>
      <button mat-button>
        <mat-icon>delete</mat-icon> Delete
      </button >
    </ng-container>


<!--    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr> -->
    <!--llamamos a la funcion definida en ts -->
    <tr mat-header-row *matHeaderRowDef="getDisplayColums()"></tr>
    <tr mat-row *matRowDef="let row; columns: getDisplayColums();"></tr>
  </table>

  <mat-paginator
  [pageSizeOptions]="[1, 5, 10, 100]"
  aria-label="pagina de editoriales"></mat-paginator>

  <button mat-flat-style = "float : rigt;" routerLink="/pages/publisher ">
    <mat-icon> add </mat-icon>
  </button >
